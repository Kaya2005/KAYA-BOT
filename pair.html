<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYA-BOT | Pairing Dashboard</title>

<style>

/* =====================================================
   VARIABLES & THEMING
===================================================== */

:root {
    --bg: #030605;
    --card: #08100d;
    --card2: #0a1511;
    --input: #020604;

    --border: rgba(74, 222, 128, 0.25);
    --border-hover: rgba(74, 222, 128, 0.5);
    --border-soft: rgba(42, 68, 55, 0.35);

    --gold: #f59e0b;
    --green: #4ade80;
    --green-glow: rgba(74,222,128,.15);
    --red: #ef4444;

    --text: #f8fafc;
    --muted: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 50% -15%, rgba(74,222,128,.08), transparent 45%),
        var(--bg);
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.dashboard {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* =====================================================
   HEADER & LOGO ICON
===================================================== */

.brand {
    text-align: center;
    padding: 2px 0;
}

.brand-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
}

.brand-subtitle {
    margin-top: 2px;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
}

.main-card {
    position: relative;
    background: linear-gradient(145deg, rgba(8,18,13,0.95), rgba(3,8,5,0.98));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(74,222,128,0.1);
}

/* Logo Box / Avatar */
.bot-logo-box {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(10,30,20,0.9), rgba(2,8,5,0.9));
    border: 1px solid var(--border);
    box-shadow: 0 0 20px var(--green-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.bot-logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-title {
    font-size: 24px;
    text-align: center;
    line-height: 1.15;
    font-weight: 700;
    margin-bottom: 2px;
    letter-spacing: .5px;
}

.card-desc {
    color: var(--muted);
    text-align: center;
    font-size: 11px;
    letter-spacing: .5px;
    margin-bottom: 18px;
}


/* =====================================================
   CUSTOM SEARCHABLE DROPDOWN
===================================================== */

.input-group {
    margin-bottom: 12px;
}

.input-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.custom-dropdown {
    position: relative;
    width: 100%;
}

.dropdown-selected {
    height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    transition: all .2s ease;
}

.dropdown-selected:hover {
    border-color: var(--border-hover);
}

.dropdown-selected.active {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(74,222,128,.1), 0 0 12px var(--green-glow);
}

.dropdown-list-container {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 100%;
    max-height: 240px;
    background: #06100b;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    z-index: 99;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: fadeInDrop 0.2s ease-out;
}

@keyframes fadeInDrop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

.dropdown-search-box {
    padding: 8px;
    border-bottom: 1px solid var(--border-soft);
    background: #040c08;
}

.dropdown-search-box input {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    outline: none;
}

.dropdown-search-box input:focus {
    border-color: var(--green);
}

.dropdown-options {
    overflow-y: auto;
    max-height: 175px;
    padding: 4px;
}

.dropdown-option {
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s, color 0.15s;
}

.dropdown-option:hover {
    background: rgba(74,222,128,0.12);
    color: #fff;
}

.dropdown-option .opt-code {
    font-family: 'JetBrains Mono', monospace;
    color: var(--green);
    font-weight: 600;
    font-size: 11px;
}


/* =====================================================
   PHONE ROW
===================================================== */

.phone-row {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 8px;
}

.country-code-input {
    height: 48px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: all .2s ease;
}

.country-code-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(74,222,128,.1), 0 0 12px var(--green-glow);
}

input[type="tel"] {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: all .2s ease;
}

input::placeholder {
    color: #3b4d44;
    font-size: 12px;
}

input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(74,222,128,.1), 0 0 12px var(--green-glow);
}


/* =====================================================
   BUTTONS
===================================================== */

button {
    font-family: 'Space Grotesk', sans-serif;
}

.btn-connect {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .8px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    transition: all .2s ease;
    margin-top: 4px;
}

.btn-connect:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
}

.btn-connect:active {
    transform: scale(.985);
}

.btn-connect:disabled {
    cursor: wait;
    opacity: .6;
}

.btn-refresh {
    width: 100%;
    height: 40px;
    margin-top: 8px;
    border-radius: 9px;
    border: 1px solid var(--border-soft);
    background: rgba(6,14,10,0.6);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s ease;
}

.btn-refresh:hover {
    background: var(--card2);
    color: var(--text);
    border-color: var(--border);
}


/* =====================================================
   LOADER & RESULT
===================================================== */

.loader {
    width: 24px;
    height: 24px;
    margin: 14px auto 2px;
    display: none;
    border-radius: 50%;
    border: 3px solid rgba(74,222,128,0.1);
    border-top-color: var(--green);
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#result {
    margin-top: 12px;
    text-align: center;
}

.code-wrapper {
    padding: 12px 10px 10px;
    border-radius: 10px;
    border: 1px solid rgba(74,222,128,.2);
    background: linear-gradient(145deg, rgba(2,7,4,0.98), rgba(5,12,8,0.98));
}

.code-title {
    margin-bottom: 8px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
}

.code-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin-bottom: 10px;
    overflow: hidden;
}

.code-char {
    width: 28px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid rgba(74,222,128,.3);
    background: rgba(8,20,13,0.95);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
}

.code-char.dash {
    width: 8px;
    border: none;
    background: transparent;
    color: var(--gold);
    font-size: 16px;
}

.btn-copy {
    width: 100%;
    height: 38px;
    border-radius: 8px;
    border: 1px solid rgba(74,222,128,.3);
    background: rgba(74,222,128,.1);
    color: var(--green);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    transition: all .2s ease;
}

.btn-copy:hover {
    background: rgba(74,222,128,.2);
}

.error-message {
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    padding: 6px;
}


/* =====================================================
   COUNTER / SESSIONS CARD
===================================================== */

.logs-card {
    background: linear-gradient(145deg, rgba(8,18,13,0.95), rgba(3,8,5,0.98));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.logs-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
}


/* =====================================================
   MODAL
===================================================== */

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 16px;
}

.modal-content {
    background: linear-gradient(145deg, rgba(8,18,13,0.99), rgba(3,8,5,0.99));
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    overflow: hidden;
    animation: modalScale 0.2s ease-out;
}

@keyframes modalScale {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.modal-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
}

.modal-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}

.modal-close {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-soft);
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s ease;
}

.modal-close:hover {
    background: rgba(239, 68, 68, 0.2);
    color: var(--red);
    border-color: rgba(239, 68, 68, 0.4);
}

.modal-body {
    padding: 14px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.number-item {
    background: rgba(4, 12, 8, 0.9);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
}

.number-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
}

.number-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
}

.number-status {
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
}


/* =====================================================
   CHANNELS FOOTER
===================================================== */

.channels-footer {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 8px;
}

.channel-btn {
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    color: white;
    transition: all .2s ease;
    border: 1px solid rgba(255,255,255,0.1);
}

.channel-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

.whatsapp-btn {
    background: linear-gradient(135deg, #25d366, #128c7e);
}

.telegram-btn {
    background: linear-gradient(135deg, #229ed9, #1a73a9);
}

</style>
</head>

<body>

<div class="dashboard">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-title">KAYA-BOT</div>
        <div class="brand-subtitle">Advanced WhatsApp Pairing System</div>
    </div>

    <!-- MAIN CARD -->
    <div class="main-card">
        
        <!-- LOGO ICON AESTHETIC -->
        <div class="bot-logo-box">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            </svg>
        </div>

        <div class="card-title">KAYA BOT</div>
        <div class="card-desc">Multi Device WhatsApp Bot</div>

        <!-- SELECTEUR DE PAYS PERSONNALISÉ -->
        <div class="input-group">
            <label class="input-label">Country</label>
            <div class="custom-dropdown" id="countryDropdown">
                <div class="dropdown-selected" id="dropdownSelected" onclick="toggleDropdown()">
                    <span id="selectedCountryText">🇨🇩 Democratic Republic of the Congo (+243)</span>
                    <span style="font-size: 9px; color: var(--muted);">▼</span>
                </div>
                <div class="dropdown-list-container" id="dropdownList">
                    <div class="dropdown-search-box">
                        <input type="text" id="countrySearch" placeholder="🔍 Search country or code..." oninput="filterCountries()">
                    </div>
                    <div class="dropdown-options" id="dropdownOptions">
                        <!-- Injection dynamique -->
                    </div>
                </div>
            </div>
        </div>

        <!-- WHATSAPP NUMBER -->
        <div class="input-group">
            <label class="input-label">WhatsApp Number</label>
            <div class="phone-row">
                <input
                    type="text"
                    id="prefixInput"
                    class="country-code-input"
                    value="+243"
                    autocomplete="off"
                    oninput="syncCountryFromPrefix()"
                >
                <input
                    type="tel"
                    id="phone"
                    placeholder="9999585890"
                    autocomplete="off"
                    inputmode="numeric"
                >
            </div>
        </div>

        <!-- CONNECT -->
        <button class="btn-connect" id="connectBtn" onclick="getPairingCode()">
            Connect WhatsApp
        </button>

        <!-- REFRESH -->
        <button class="btn-refresh" onclick="window.location.reload()">
            ↻ Refresh Dashboard
        </button>

        <!-- LOADER -->
        <div class="loader" id="loader"></div>

        <!-- RESULT -->
        <div id="result"></div>

    </div>


    <!-- ACTIVE SESSIONS COUNTER CARD -->
    <div class="logs-card" onclick="openConnectedModal()">
        <div id="activeCount" style="font-size: 12px; font-weight: bold; color: var(--green);">
            🟢 Loading connected bots...
        </div>
        <div style="font-size: 9px; color: var(--muted); margin-top: 2px;">👆 Tap to view connected numbers</div>
    </div>


    <!-- CHANNELS FOOTER -->
    <div class="channels-footer">
        <a href="https://whatsapp.com/channel/0029Vb91eHA7Noa7fCn1vp3j" target="_blank" rel="noopener" class="channel-btn whatsapp-btn">
            📢 WhatsApp
        </a>
        <a href="https://t.me/kayatech2" target="_blank" rel="noopener" class="channel-btn telegram-btn">
            ✈️ Telegram
        </a>
    </div>

</div>


<!-- MODAL -->
<div class="modal-overlay" id="connectedModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Connected Numbers</div>
            <button class="modal-close" onclick="closeConnectedModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBodyList">
            <div style="text-align: center; color: var(--muted); padding: 20px;">Loading numbers...</div>
        </div>
    </div>
</div>

function renderCountries(list) {
    const container = document.getElementById('dropdownOptions');
    container.innerHTML = '';
    
    list.forEach(c => {
        const div = document.createElement('div');
        div.className = 'dropdown-option';
        div.innerHTML = `<span>${c.flag} ${c.name}</span> <span class="opt-code">${c.code}</span>`;
        div.onclick = () => selectCountry(c);
        container.appendChild(div);
    });
}

function toggleDropdown() {
    const list = document.getElementById('dropdownList');
    const selectedBox = document.getElementById('dropdownSelected');
    const isVisible = list.style.display === 'flex';
    
    if (isVisible) {
        list.style.display = 'none';
        selectedBox.classList.remove('active');
    } else {
        list.style.display = 'flex';
        selectedBox.classList.add('active');
        document.getElementById('countrySearch').focus();
    }
}

function selectCountry(country) {
    document.getElementById('selectedCountryText').innerText = `${country.flag} ${country.name} (${country.code})`;
    document.getElementById('prefixInput').value = country.code;
    document.getElementById('dropdownList').style.display = 'none';
    document.getElementById('dropdownSelected').classList.remove('active');
}

function filterCountries() {
    const query = document.getElementById('countrySearch').value.toLowerCase();
    const filtered = countries.filter(c => 
        c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)
    );
    renderCountries(filtered);
}

// Synchronisation bidirectionnelle : si l'utilisateur tape l'indicatif directement
function syncCountryFromPrefix() {
    let val = document.getElementById('prefixInput').value.trim();
    if (!val.startsWith('+')) val = '+' + val;
    
    const matched = countries.find(c => c.code === val);
    if (matched) {
        document.getElementById('selectedCountryText').innerText = `${matched.flag} ${matched.name} (${matched.code})`;
    }
}

// Fermeture du dropdown au clic extérieur
window.addEventListener('click', function(e) {
    const dropdown = document.getElementById('countryDropdown');
    if (!dropdown.contains(e.target)) {
        document.getElementById('dropdownList').style.display = 'none';
        document.getElementById('dropdownSelected').classList.remove('active');
    }
});

/* =====================================================
   GESTION DES SESSIONS & MODALE
===================================================== */

async function fetchActiveSessions() {
    try {
        const response = await fetch(`${BACKEND_URL}/api/online-count`);
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('activeCount').innerText = `🟢 ${data.totalConnected} connected bots`;
        } else {
            document.getElementById('activeCount').innerText = '🟢 Active sessions online';
        }
    } catch (e) {
        document.getElementById('activeCount').innerText = '🟢 Active sessions online';
    }
}

async function openConnectedModal() {
    const modal = document.getElementById('connectedModal');
    const modalBody = document.getElementById('modalBodyList');
    
    modal.style.display = 'flex';
    modalBody.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 20px;">Loading numbers...</div>`;

    try {
        const response = await fetch(`${BACKEND_URL}/api/connected-list`);
        const data = await response.json();

        if (data.success && data.numbers && data.numbers.length > 0) {
            let html = '';
            data.numbers.forEach(num => {
                let maskedNum = maskPhoneNumber(num);
                html += `
                    <div class="number-item">
                        <div class="number-left">
                            <div class="number-dot"></div>
                            <span>${maskedNum}</span>
                        </div>
                        <div class="number-status">Connected</div>
                    </div>
                `;
            });
            modalBody.innerHTML = html;
        } else {
            modalBody.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 20px;">No numbers currently connected.</div>`;
        }
    } catch (error) {
        modalBody.innerHTML = `<div style="text-align: center; color: var(--red); padding: 20px;">Failed to load connected numbers.</div>`;
    }
}

function closeConnectedModal() {
    document.getElementById('connectedModal').style.display = 'none';
}

function maskPhoneNumber(phone) {
    let clean = phone.toString().trim();
    if (!clean.startsWith('+')) clean = '+' + clean;
    if (clean.length > 8) {
        let start = clean.slice(0, 5);
        let end = clean.slice(-2);
        return `${start}****${end}`;
    }
    return clean;
}


/* =====================================================
   GÉNÉRATION DU CODE DE PAIRAGE
===================================================== */

async function getPairingCode() {
    let prefix = document.getElementById('prefixInput').value.trim();
    const phoneInput = document.getElementById('phone');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const connectBtn = document.getElementById('connectBtn');

    if (!prefix.startsWith('+')) prefix = '+' + prefix;

    let rawNumber = phoneInput.value.trim().replace(/\s+/g, '');
    if (rawNumber.startsWith('0')) rawNumber = rawNumber.slice(1);

    const fullPhone = prefix + rawNumber;

    if (!rawNumber || rawNumber.length < 8 || !/^[0-9]+$/.test(rawNumber)) {
        resultDiv.innerHTML = `<div class="error-message">❌ Please enter a valid WhatsApp number.</div>`;
        return;
    }

    resultDiv.innerHTML = '';
    loader.style.display = 'block';
    connectBtn.disabled = true;
    connectBtn.innerText = '⏳ GENERATING CODE...';

    try {
        const response = await fetch(`${BACKEND_URL}/api/connect`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: fullPhone })
        });

        const data = await response.json();

        loader.style.display = 'none';
        connectBtn.disabled = false;
        connectBtn.innerText = 'Connect WhatsApp';

        if (data.success && data.code) {
            currentPairCode = data.code;
            const cleanCode = data.code.replace(/-/g, '').trim();

            let codeHtml = `
                <div class="code-wrapper">
                    <div class="code-title">Your Pairing Code</div>
                    <div class="code-container">
            `;

            for (let i = 0; i < cleanCode.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    codeHtml += `<div class="code-char dash">-</div>`;
                }
                codeHtml += `<div class="code-char">${cleanCode[i]}</div>`;
            }

            codeHtml += `
                    </div>
                    <button class="btn-copy" onclick="copyCode()">📋 COPY PAIRING CODE</button>
                </div>
            `;

            resultDiv.innerHTML = codeHtml;
            fetchActiveSessions();
        } else {
            resultDiv.innerHTML = `<div class="error-message">❌ ${data.message || 'Failed to generate pairing code.'}</div>`;
        }
    } catch (error) {
        loader.style.display = 'none';
        connectBtn.disabled = false;
        connectBtn.innerText = 'Connect WhatsApp';
        resultDiv.innerHTML = `<div class="error-message">❌ Server connection error. Please try again.</div>`;
    }
}


/* =====================================================
   COPIER LE CODE
===================================================== */

async function copyCode() {
    if (!currentPairCode) return;
    const btn = document.querySelector('.btn-copy');

    try {
        await navigator.clipboard.writeText(currentPairCode);
        btn.innerText = '✅ CODE COPIED!';
        btn.style.background = 'rgba(74,222,128,.25)';

        setTimeout(() => {
            btn.innerText = '📋 COPY PAIRING CODE';
            btn.style.background = 'rgba(74,222,128,.1)';
        }, 2000);
    } catch (error) {
        const textarea = document.createElement('textarea');
        textarea.value = currentPairCode;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();

        btn.innerText = '✅ CODE COPIED!';
        setTimeout(() => {
            btn.innerText = '📋 COPY PAIRING CODE';
        }, 2000);
    }
}

document.getElementById('phone').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        getPairingCode();
    }
});
