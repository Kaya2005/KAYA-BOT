<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAYA-BOT | Pairing Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {
            --bg: #030605;
            --card: #08100d;
            --card-light: #0c1712;
            --border: #15261e;

            --gold: #f59e0b;
            --gold-dark: #d97706;
            --gold-glow: rgba(245, 158, 11, 0.22);

            --green: #4ade80;
            --green-glow: rgba(74, 222, 128, 0.15);

            --red: #ef4444;

            --text: #f8fafc;
            --muted: #94a3b8;

            --whatsapp: #25d366;
            --telegram: #229ed9;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            font-family: 'Space Grotesk', sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(245, 158, 11, 0.10),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(74, 222, 128, 0.04),
                    transparent 35%
                ),
                var(--bg);

            padding: 18px 14px 30px;

            display: flex;
            justify-content: center;
        }


        /* =====================================================
           DASHBOARD
        ===================================================== */

        .dashboard {
            width: 100%;
            max-width: 470px;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .brand {
            text-align: center;
            padding: 6px 0 2px;
        }


        .brand-title {
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 4px;

            color: var(--gold);

            text-transform: uppercase;
        }


        .brand-subtitle {
            margin-top: 4px;

            font-size: 10px;

            letter-spacing: 1.5px;

            color: var(--muted);

            text-transform: uppercase;
        }


        /* =====================================================
           ACTIVE BOTS
        ===================================================== */

        .stat-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(12, 23, 18, 0.98),
                    rgba(5, 12, 9, 0.98)
                );

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 20px 18px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255,255,255,0.02);
        }


        .stat-icon {
            font-size: 17px;
            margin-bottom: 2px;
        }


        .stat-value {
            font-family: 'JetBrains Mono', monospace;

            font-size: 38px;
            line-height: 1.1;

            font-weight: 700;

            color: var(--gold);

            text-shadow:
                0 0 20px var(--gold-glow);
        }


        .stat-label {
            margin-top: 5px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2px;

            color: var(--muted);

            text-transform: uppercase;
        }


        .online-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 5px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .main-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 20, 15, 0.98),
                    rgba(5, 11, 8, 0.98)
                );

            border: 1px solid var(--border);

            border-radius: 22px;

            padding: 22px 18px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.55);
        }


        /* =====================================================
           BADGE
        ===================================================== */

        .edition-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 6px 11px;

            margin-bottom: 14px;

            border-radius: 8px;

            background:
                rgba(245, 158, 11, 0.08);

            border:
                1px solid rgba(245, 158, 11, 0.30);

            color: var(--gold);

            font-family: 'JetBrains Mono', monospace;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

            box-shadow:
                0 0 15px rgba(245,158,11,0.05);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .card-title {
            font-size: 27px;

            line-height: 1.15;

            font-weight: 700;

            margin-bottom: 8px;

            color: var(--text);
        }


        .card-desc {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 23px;

            max-width: 350px;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-group {
            margin-bottom: 14px;
        }


        .input-label {
            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 8px;

            color: var(--muted);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.4px;

            text-transform: uppercase;
        }


        .input-label::before {
            content: "☎";

            color: var(--gold);

            font-size: 13px;
        }


        input {
            width: 100%;

            height: 56px;

            padding: 0 16px;

            border-radius: 14px;

            border: 1px solid var(--border);

            background:
                rgba(2, 6, 4, 0.95);

            color: #fff;

            font-family: 'JetBrains Mono', monospace;

            font-size: 17px;

            font-weight: 600;

            text-align: center;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                transform 0.2s;
        }


        input::placeholder {
            color: #53645b;

            font-size: 13px;
        }


        input:focus {
            border-color: var(--gold);

            box-shadow:
                0 0 0 3px rgba(245,158,11,0.08),
                0 0 20px var(--gold-glow);

            transform: translateY(-1px);
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        button {
            font-family: 'Space Grotesk', sans-serif;
        }


        .btn-connect {
            width: 100%;

            height: 56px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #fbbf24,
                    var(--gold-dark)
                );

            color: #080808;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 8px 25px var(--gold-glow);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                filter 0.2s;
        }


        .btn-connect:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(245,158,11,0.35);

            filter: brightness(1.05);
        }


        .btn-connect:active {
            transform: scale(0.98);
        }


        .btn-refresh {
            width: 100%;

            height: 48px;

            margin-top: 10px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background:
                rgba(16, 28, 23, 0.8);

            color: var(--muted);

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-refresh:hover {
            background: var(--card-light);

            color: var(--text);

            border-color: #20372b;
        }


        /* =====================================================
           LOADER
        ===================================================== */

        .loader {
            width: 30px;
            height: 30px;

            margin: 20px auto 5px;

            display: none;

            border-radius: 50%;

            border: 3px solid #14221b;

            border-top-color: var(--gold);

            animation: spin 0.8s linear infinite;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           RESULT
        ===================================================== */

        #result {
            margin-top: 17px;

            text-align: center;
        }


        /* =====================================================
           PAIRING CODE
        ===================================================== */

        .code-wrapper {
            padding: 17px 12px 13px;

            border-radius: 16px;

            border: 1px solid rgba(74,222,128,0.12);

            background:
                linear-gradient(
                    145deg,
                    rgba(2,7,4,0.95),
                    rgba(5,13,9,0.95)
                );

            box-shadow:
                inset 0 1px rgba(255,255,255,0.02);
        }


        .code-title {
            margin-bottom: 13px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2px;

            color: var(--muted);

            text-transform: uppercase;
        }


        .code-container {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 5px;

            margin-bottom: 14px;

            overflow: hidden;
        }


        .code-char {
            width: 30px;
            height: 39px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 7px;

            border:
                1px solid rgba(74,222,128,0.35);

            background:
                rgba(8,20,13,0.95);

            color: var(--green);

            font-family: 'JetBrains Mono', monospace;

            font-size: 16px;

            font-weight: 700;

            box-shadow:
                0 0 10px rgba(74,222,128,0.06);
        }


        .code-char.dash {
            width: 10px;

            border: none;

            background: transparent;

            color: var(--gold);

            font-size: 19px;

            box-shadow: none;
        }


        .btn-copy {
            width: 100%;

            height: 43px;

            border-radius: 10px;

            border:
                1px solid rgba(74,222,128,0.35);

            background:
                rgba(74,222,128,0.10);

            color: var(--green);

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-copy:hover {
            background:
                rgba(74,222,128,0.18);

            box-shadow:
                0 0 18px rgba(74,222,128,0.10);
        }


        /* =====================================================
           LOGS
        ===================================================== */

        .logs-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(10,20,15,0.98),
                    rgba(5,11,8,0.98)
                );

            border: 1px solid var(--border);

            border-radius: 19px;

            padding: 16px;
        }


        .logs-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 10px;
        }


        .logs-title {
            color: var(--muted);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .live {
            display: flex;

            align-items: center;

            gap: 5px;

            font-size: 9px;

            font-weight: 700;

            color: var(--green);

            text-transform: uppercase;
        }


        .live::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 8px var(--green);
        }


        .logs-terminal {
            padding: 12px;

            min-height: 67px;

            border-radius: 12px;

            background:
                #020604;

            font-family: 'JetBrains Mono', monospace;

            font-size: 10px;

            line-height: 1.8;

            overflow-x: auto;
        }


        .log-item {
            color: var(--green);

            opacity: 0.8;

            white-space: nowrap;
        }


        .log-item.system {
            color: var(--gold);

            opacity: 0.9;
        }


        /* =====================================================
           CHANNELS
        ===================================================== */

        .channels-footer {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }


        .channel-btn {
            min-height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            border-radius: 13px;

            text-decoration: none;

            font-size: 12px;

            font-weight: 800;

            color: white;

            box-shadow:
                0 6px 18px rgba(0,0,0,0.3);

            transition: 0.2s;
        }


        .channel-btn:hover {
            transform: translateY(-2px);

            opacity: 0.92;
        }


        .whatsapp-btn {
            background:
                linear-gradient(
                    135deg,
                    #25d366,
                    #128c7e
                );
        }


        .telegram-btn {
            background:
                linear-gradient(
                    135deg,
                    #229ed9,
                    #1a73a9
                );
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            body {
                padding: 12px 10px 25px;
            }

            .main-card {
                padding: 19px 14px;
            }

            .card-title {
                font-size: 24px;
            }

            .code-char {
                width: 27px;
                height: 36px;
            }

            .code-container {
                gap: 3px;
            }

            .code-char.dash {
                width: 8px;
            }
        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 700px) {

            body {
                padding-top: 35px;
            }

            .dashboard {
                max-width: 470px;
            }
        }

    </style>
</head>


<body>

<div class="dashboard">


    <!-- =====================================================
         BRAND
    ====================================================== -->

    <div class="brand">

        <div class="brand-title">
            KAYA-BOT
        </div>

        <div class="brand-subtitle">
            Advanced WhatsApp Pairing System
        </div>

    </div>


    <!-- =====================================================
         ACTIVE BOTS
    ====================================================== -->

    <div class="stat-card">

        <div class="stat-icon">
            🤖
        </div>

        <div
            class="stat-value"
            id="bots-count"
        >
            0/60
        </div>

        <div class="stat-label">
            <span class="online-dot"></span>
            Active Bots
        </div>

    </div>


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <div class="main-card">


        <div class="edition-badge">
            ƘƛƳƛ ƁƠƬ
        </div>


        <div class="card-title">
            Connect KAYA BOT
        </div>


        <div class="card-desc">
            Generate your WhatsApp pairing code instantly
            without using a QR code.
        </div>


        <!-- PHONE -->

        <div class="input-group">

            <label class="input-label">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="243999999999"
                autocomplete="off"
                inputmode="numeric"
            >

        </div>


        <!-- CONNECT -->

        <button
            class="btn-connect"
            id="connectBtn"
            onclick="getPairingCode()"
        >
            ⚡ CONNECT BOT
        </button>


        <!-- REFRESH -->

        <button
            class="btn-refresh"
            onclick="window.location.reload()"
        >
            ↻ REFRESH DASHBOARD
        </button>


        <!-- LOADER -->

        <div
            class="loader"
            id="loader"
        ></div>


        <!-- RESULT -->

        <div id="result"></div>

    </div>


    <!-- =====================================================
         LOGS
    ====================================================== -->

    <div class="logs-card">

        <div class="logs-header">

            <div class="logs-title">
                📋 Live Logs
            </div>

            <div class="live">
                Online
            </div>

        </div>


        <div class="logs-terminal">

            <div class="log-item">
                [SYSTEM] 🟢 Dashboard online & ready
            </div>

            <div class="log-item system">
                [RAILWAY] Backend connection established
            </div>

        </div>

    </div>


    <!-- =====================================================
         CHANNELS
    ====================================================== -->

    <div class="channels-footer">

        <a
            href="https://whatsapp.com/channel/0029Vb91eHA7Noa7fCn1vp3j"
            target="_blank"
            rel="noopener"
            class="channel-btn whatsapp-btn"
        >
            📢 WhatsApp
        </a>


        <a
            href="https://t.me/kayatech2"
            target="_blank"
            rel="noopener"
            class="channel-btn telegram-btn"
        >
            ✈️ Telegram
        </a>

    </div>


</div>


<script>

    /* =====================================================
       RAILWAY BACKEND
    ===================================================== */

    const BACKEND_URL =
        'https://kaya-web-production.up.railway.app';


    let currentPairCode = '';


    /* =====================================================
       ACTIVE SESSIONS
    ===================================================== */

    async function fetchActiveSessions() {

        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/api/listpair`
                );

            if (!response.ok) {
                throw new Error('Backend unavailable');
            }

            const data =
                await response.json();


            if (
                data &&
                typeof data.total !== 'undefined'
            ) {

                document.getElementById(
                    'bots-count'
                ).innerText =
                    `${data.total}/60`;

            }

        } catch (error) {

            console.log(
                'Railway backend unavailable.'
            );

        }

    }


    fetchActiveSessions();


    /* =====================================================
       GENERATE PAIRING CODE
    ===================================================== */

    async function getPairingCode() {

        const phoneInput =
            document.getElementById('phone');

        const resultDiv =
            document.getElementById('result');

        const loader =
            document.getElementById('loader');

        const connectBtn =
            document.getElementById('connectBtn');


        const phone =
            phoneInput.value
                .trim()
                .replace(/\s+/g, '');


        /* ================================================
           VALIDATION
        ================================================= */

        if (
            !phone ||
            phone.length < 9 ||
            !/^[0-9]+$/.test(phone)
        ) {

            resultDiv.innerHTML = `

                <div style="
                    color: var(--red);
                    font-size: 12px;
                    font-weight: 700;
                    padding: 10px;
                ">
                    ❌ Please enter a valid phone number.
                </div>

            `;

            return;
        }


        /* ================================================
           LOADING
        ================================================= */

        resultDiv.innerHTML = '';

        loader.style.display = 'block';

        connectBtn.disabled = true;

        connectBtn.style.opacity = '0.6';

        connectBtn.innerText =
            '⏳ GENERATING CODE...';


        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/api/connect`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            phone: phone
                        })
                    }
                );


            const data =
                await response.json();


            loader.style.display = 'none';

            connectBtn.disabled = false;

            connectBtn.style.opacity = '1';

            connectBtn.innerText =
                '⚡ CONNECT BOT';


            /* ==========================================
               SUCCESS
            ========================================== */

            if (
                data.success &&
                data.code
            ) {

                currentPairCode =
                    data.code;


                const cleanCode =
                    data.code
                        .replace(/-/g, '')
                        .trim();


                let codeHtml = `

                    <div class="code-wrapper">

                        <div class="code-title">
                            Your Pairing Code
                        </div>

                        <div class="code-container">
                `;


                for (
                    let i = 0;
                    i < cleanCode.length;
                    i++
                ) {

                    if (
                        i > 0 &&
                        i % 4 === 0
                    ) {

                        codeHtml += `
                            <div class="code-char dash">
                                -
                            </div>
                        `;

                    }


                    codeHtml += `

                        <div class="code-char">
                            ${cleanCode[i]}
                        </div>

                    `;

                }


                codeHtml += `

                        </div>

                        <button
                            class="btn-copy"
                            onclick="copyCode()"
                        >
                            📋 COPY PAIRING CODE
                        </button>

                    </div>

                `;


                resultDiv.innerHTML =
                    codeHtml;

            }


            /* ==========================================
               ERROR
            ========================================== */

            else {

                resultDiv.innerHTML = `

                    <div style="
                        color: var(--red);
                        font-size: 12px;
                        font-weight: 700;
                        padding: 10px;
                    ">
                        ❌ ${
                            data.message ||
                            'Failed to generate pairing code.'
                        }
                    </div>

                `;

            }

        }


        /* ================================================
           CONNECTION ERROR
        ================================================= */

        catch (error) {

            console.error(
                'Railway error:',
                error
            );


            loader.style.display = 'none';

            connectBtn.disabled = false;

            connectBtn.style.opacity = '1';

            connectBtn.innerText =
                '⚡ CONNECT BOT';


            resultDiv.innerHTML = `

                <div style="
                    color: var(--red);
                    font-size: 12px;
                    font-weight: 700;
                    padding: 10px;
                ">
                    ❌ Server connection error.
                    Please try again.
                </div>

            `;

        }

    }


    /* =====================================================
       COPY CODE
    ===================================================== */

    async function copyCode() {

        if (!currentPairCode)
            return;


        const btn =
            document.querySelector('.btn-copy');


        try {

            await navigator.clipboard
                .writeText(currentPairCode);


            btn.innerText =
                '✅ CODE COPIED!';


            btn.style.background =
                'rgba(74,222,128,0.25)';


            setTimeout(() => {

                btn.innerText =
                    '📋 COPY PAIRING CODE';

                btn.style.background =
                    'rgba(74,222,128,0.10)';

            }, 2000);


        } catch (error) {

            /* Fallback */

            const textarea =
                document.createElement('textarea');

            textarea.value =
                currentPairCode;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                'copy'
            );

            textarea.remove();


            btn.innerText =
                '✅ CODE COPIED!';


            setTimeout(() => {

                btn.innerText =
                    '📋 COPY PAIRING CODE';

            }, 2000);

        }

    }


    /* =====================================================
       ENTER = CONNECT
    ===================================================== */

    document
        .getElementById('phone')
        .addEventListener(
            'keydown',
            function(event) {

                if (
                    event.key === 'Enter'
                ) {

                    getPairingCode();

                }

            }
        );

</script>

</body>
</html>
