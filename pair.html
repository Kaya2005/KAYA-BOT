<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYA-BOT | Pairing Dashboard</title>

    });

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {
    --bg: #030605;
    --card: #08100d;
    --card2: #0a1511;
    --input: #020604;

    --border: rgba(42, 68, 55, 0.55);
    --border-soft: rgba(42, 68, 55, 0.35);

    --gold: #f59e0b;
    --gold-light: #fbbf24;
    --gold-dark: #d97706;
    --gold-glow: rgba(245,158,11,.18);

    --green: #4ade80;
    --green-glow: rgba(74,222,128,.12);

    --red: #ef4444;

    --text: #f8fafc;
    --muted: #94a3b8;

    --whatsapp: #25d366;
    --telegram: #229ed9;
}


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(245,158,11,.07),
            transparent 40%
        ),
        var(--bg);

    padding: 14px;

    display: flex;
    justify-content: center;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {
    width: 100%;
    max-width: 460px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}


/* =====================================================
   BRAND
===================================================== */

.brand {
    text-align: center;
    padding: 3px 0 4px;
}

.brand-title {
    font-size: 13px;
    font-weight: 700;

    letter-spacing: 3px;
    color: var(--gold);

    text-transform: uppercase;
}

.brand-subtitle {
    margin-top: 3px;

    font-size: 9px;
    letter-spacing: 1.2px;

    color: var(--muted);

    text-transform: uppercase;
}


/* =====================================================
   MAIN CARD
===================================================== */

.main-card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(9,19,14,.98),
            rgba(4,10,7,.98)
        );

    border: 1px solid var(--border-soft);

    border-radius: 14px;

    padding: clamp(16px, 4vw, 21px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}


/* =====================================================
   BADGE
===================================================== */

.edition-badge {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 5px 9px;

    margin-bottom: 11px;

    border-radius: 6px;

    background:
        rgba(245,158,11,.06);

    border:
        1px solid rgba(245,158,11,.22);

    color: var(--gold);

    font-family: 'JetBrains Mono', monospace;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: .8px;
}


/* =====================================================
   TITLE
===================================================== */

.card-title {
    font-size: clamp(22px, 6vw, 27px);

    line-height: 1.15;

    font-weight: 700;

    margin-bottom: 6px;
}

.card-desc {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.5;

    margin-bottom: 18px;

    max-width: 390px;
}


/* =====================================================
   INPUT
===================================================== */

.input-group {
    margin-bottom: 11px;
}

.input-label {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 6px;

    color: var(--muted);

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.input-label::before {
    content: "☎";

    color: var(--gold);

    font-size: 12px;
}

input {
    width: 100%;

    height: 50px;

    padding: 0 13px;

    border-radius: 10px;

    border:
        1px solid var(--border);

    background:
        var(--input);

    color: #fff;

    font-family:
        'JetBrains Mono',
        monospace;

    font-size: clamp(14px, 4vw, 17px);

    font-weight: 600;

    text-align: center;

    outline: none;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input::placeholder {
    color: #4f6058;

    font-size: 12px;
}

input:focus {
    border-color: var(--gold);

    box-shadow:
        0 0 0 2px rgba(245,158,11,.06),
        0 0 14px var(--gold-glow);
}


/* =====================================================
   BUTTONS
===================================================== */

button {
    font-family:
        'Space Grotesk',
        sans-serif;
}

.btn-connect {
    width: 100%;

    height: 50px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold-dark)
        );

    color: #050505;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: .4px;

    cursor: pointer;

    box-shadow:
        0 5px 17px var(--gold-glow);

    transition:
        transform .15s,
        filter .15s;
}

.btn-connect:hover {
    filter: brightness(1.05);

    transform: translateY(-1px);
}

.btn-connect:active {
    transform: scale(.985);
}

.btn-connect:disabled {
    cursor: wait;
}


.btn-refresh {
    width: 100%;

    height: 43px;

    margin-top: 7px;

    border-radius: 9px;

    border:
        1px solid var(--border);

    background:
        rgba(13,25,19,.75);

    color: var(--muted);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .4px;

    cursor: pointer;

    transition: .2s;
}

.btn-refresh:hover {
    background: var(--card2);

    color: var(--text);
}


/* =====================================================
   LOADER
===================================================== */

.loader {
    width: 27px;
    height: 27px;

    margin: 15px auto 2px;

    display: none;

    border-radius: 50%;

    border:
        3px solid #122019;

    border-top-color:
        var(--gold);

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   RESULT
===================================================== */

#result {
    margin-top: 13px;

    text-align: center;
}


/* =====================================================
   PAIRING CODE
===================================================== */

.code-wrapper {
    padding:
        13px
        10px
        10px;

    border-radius: 10px;

    border:
        1px solid rgba(74,222,128,.10);

    background:
        linear-gradient(
            145deg,
            rgba(2,7,4,.98),
            rgba(5,12,8,.98)
        );
}

.code-title {
    margin-bottom: 10px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.7px;

    color: var(--muted);

    text-transform: uppercase;
}

.code-container {
    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: clamp(2px, 1.2vw, 5px);

    margin-bottom: 11px;

    overflow: hidden;
}

.code-char {
    width: clamp(25px, 7vw, 30px);

    height: clamp(33px, 9vw, 38px);

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 1;

    border-radius: 5px;

    border:
        1px solid rgba(74,222,128,.28);

    background:
        rgba(8,20,13,.95);

    color: var(--green);

    font-family:
        'JetBrains Mono',
        monospace;

    font-size: clamp(13px, 4vw, 16px);

    font-weight: 700;
}

.code-char.dash {
    width: clamp(7px, 2vw, 10px);

    border: none;

    background: transparent;

    color: var(--gold);

    font-size: 17px;
}


.btn-copy {
    width: 100%;

    height: 39px;

    border-radius: 8px;

    border:
        1px solid rgba(74,222,128,.28);

    background:
        rgba(74,222,128,.08);

    color: var(--green);

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.btn-copy:hover {
    background:
        rgba(74,222,128,.15);
}


/* =====================================================
   ERROR
===================================================== */

.error-message {
    color: var(--red);

    font-size: 11px;

    font-weight: 700;

    padding: 7px;
}


/* =====================================================
   LOGS / ACTIVE SESSIONS COUNTER
===================================================== */

.logs-card {
    background:
        linear-gradient(
            145deg,
            rgba(9,19,14,.98),
            rgba(4,10,7,.98)
        );

    border:
        1px solid var(--border-soft);

    border-radius: 12px;

    padding: 12px;
}

.logs-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 7px;
}

.logs-title {
    color: var(--muted);

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.3px;

    text-transform: uppercase;
}

.live {
    display: flex;

    align-items: center;

    gap: 4px;

    font-size: 8px;

    font-weight: 700;

    color: var(--green);

    text-transform: uppercase;
}

.live::before {
    content: "";

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 6px var(--green);
}

.logs-terminal {
    padding: 9px;

    min-height: 58px;

    border-radius: 8px;

    background:
        #020604;

    font-family:
        'JetBrains Mono',
        monospace;

    font-size: 9px;

    line-height: 1.8;

    overflow-x: auto;
}

.log-item {
    color: var(--green);

    opacity: .8;

    white-space: nowrap;
}

.log-item.system {
    color: var(--gold);

    opacity: .9;
}


/* =====================================================
   CHANNELS
===================================================== */

.channels-footer {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 8px;
}

.channel-btn {
    min-height: 43px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    border-radius: 9px;

    text-decoration: none;

    font-size: 11px;

    font-weight: 800;

    color: white;

    transition:
        transform .15s,
        opacity .15s;
}

.channel-btn:hover {
    transform: translateY(-1px);

    opacity: .9;
}

.whatsapp-btn {
    background:
        linear-gradient(
            135deg,
            #25d366,
            #128c7e
        );
}

.telegram-btn {
    background:
        linear-gradient(
            135deg,
            #229ed9,
            #1a73a9
        );
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 350px) {

    body {
        padding:
            9px
            7px
            18px;
    }

    .dashboard {
        gap: 8px;
    }

    .main-card {
        padding: 14px 12px;
    }

    .card-title {
        font-size: 21px;
    }

    .card-desc {
        font-size: 11px;
        margin-bottom: 15px;
    }

    input {
        height: 47px;
    }

    .btn-connect {
        height: 47px;
    }

    .code-container {
        gap: 2px;
    }

    .code-char {
        width: 23px;
        height: 32px;
    }

    .code-char.dash {
        width: 6px;
    }
}


/* =====================================================
   TABLETS
===================================================== */

@media (min-width: 600px) {

    body {
        padding:
            25px
            18px
            35px;
    }

    .dashboard {
        max-width: 470px;
        gap: 12px;
    }

    .main-card {
        padding: 22px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 900px) {

    body {
        align-items: flex-start;

        padding-top: 40px;
    }

    .dashboard {
        max-width: 480px;
    }

}


/* =====================================================
   VERY LARGE SCREENS
===================================================== */

@media (min-width: 1400px) {

    .dashboard {
        max-width: 500px;
    }

}

</style>
</head>


<body>

<div class="dashboard">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-title">
            KAYA-BOT
        </div>

        <div class="brand-subtitle">
            Advanced WhatsApp Pairing System
        </div>

    </div>


    <!-- MAIN CARD -->

    <div class="main-card">

        <div class="edition-badge">
             
        </div>


        <div class="card-title">
            Connect KAYA BOT
        </div>


        <div class="card-desc">
            Generate your WhatsApp pairing code instantly without using a QR code.
        </div>


        <!-- PHONE -->

        <div class="input-group">

            <label class="input-label">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="243999999999"
                autocomplete="off"
                inputmode="numeric"
            >

        </div>


        <!-- CONNECT -->

        <button
            class="btn-connect"
            id="connectBtn"
            onclick="getPairingCode()"
        >
            ⚡ CONNECT BOT
        </button>


        <!-- REFRESH -->

        <button
            class="btn-refresh"
            onclick="window.location.reload()"
        >
            ↻ REFRESH DASHBOARD
        </button>


        <!-- LOADER -->

        <div
            class="loader"
            id="loader"
        ></div>


        <!-- RESULT -->

        <div id="result"></div>

    </div>


    <!-- ACTIVE SESSIONS COUNTER CARD -->

    <div class="logs-card" style="text-align: center;">
        <div class="logs-title">🤖 Active Bot Sessions</div>
        <div id="activeCount" style="font-size: 16px; font-weight: bold; color: var(--green); margin-top: 6px;">Loading...</div>
    </div>


    <!-- LOGS -->

    <div class="logs-card">

        <div class="logs-header">

            <div class="logs-title">
                📋 Live Logs
            </div>

            <div class="live">
                Online
            </div>

        </div>


        <div class="logs-terminal">

            <div class="log-item">
                [SYSTEM] 🟢 Dashboard online & ready
            </div>

            <div class="log-item system">
                [RAILWAY] Backend connection established
            </div>

        </div>

    </div>


    <!-- CHANNELS -->

    <div class="channels-footer">

        <a
            href="https://whatsapp.com/channel/0029Vb91eHA7Noa7fCn1vp3j"
            target="_blank"
            rel="noopener"
            class="channel-btn whatsapp-btn"
        >
            📢 WhatsApp
        </a>


        <a
            href="https://t.me/kayatech2"
            target="_blank"
            rel="noopener"
            class="channel-btn telegram-btn"
        >
            ✈️ Telegram
        </a>

    </div>


</div>


<script>

/* =====================================================
   RAILWAY BACKEND
===================================================== */

const BACKEND_URL =
    'https://kaya-web-production.up.railway.app';

let currentPairCode = '';


/* =====================================================
   FETCH ACTIVE SESSIONS COUNT
===================================================== */

async function fetchActiveSessions() {
    try {
        const response = await fetch(`${BACKEND_URL}/api/online-count`);
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('activeCount').innerText = `${data.totalConnected} Connected Bot(s)`;
        } else {
            document.getElementById('activeCount').innerText = '0 Connected Bot(s)';
        }
    } catch (e) {
        document.getElementById('activeCount').innerText = 'Unavailable';
    }
}

// Fetch on page load
fetchActiveSessions();


/* =====================================================
   GENERATE PAIRING CODE
===================================================== */

async function getPairingCode() {

    const phoneInput =
        document.getElementById('phone');

    const resultDiv =
        document.getElementById('result');

    const loader =
        document.getElementById('loader');

    const connectBtn =
        document.getElementById('connectBtn');


    const phone =
        phoneInput.value
            .trim()
            .replace(/\s+/g, '');


    /* VALIDATION */

    if (
        !phone ||
        phone.length < 9 ||
        !/^[0-9]+$/.test(phone)
    ) {

        resultDiv.innerHTML = `

            <div class="error-message">
                ❌ Please enter a valid phone number.
            </div>

        `;

        return;
    }


    /* LOADING */

    resultDiv.innerHTML = '';

    loader.style.display = 'block';

    connectBtn.disabled = true;

    connectBtn.style.opacity = '.6';

    connectBtn.innerText =
        '⏳ GENERATING CODE...';


    try {

        const response =
            await fetch(
                `${BACKEND_URL}/api/connect`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        phone: phone
                    })
                }
            );


        const data =
            await response.json();


        loader.style.display = 'none';

        connectBtn.disabled = false;

        connectBtn.style.opacity = '1';

        connectBtn.innerText =
            '⚡ CONNECT BOT';


        /* SUCCESS */

        if (
            data.success &&
            data.code
        ) {

            currentPairCode =
                data.code;


            const cleanCode =
                data.code
                    .replace(/-/g, '')
                    .trim();


            let codeHtml = `

                <div class="code-wrapper">

                    <div class="code-title">
                        Your Pairing Code
                    </div>

                    <div class="code-container">
            `;


            for (
                let i = 0;
                i < cleanCode.length;
                i++
            ) {

                if (
                    i > 0 &&
                    i % 4 === 0
                ) {

                    codeHtml += `

                        <div class="code-char dash">
                            -
                        </div>

                    `;

                }


                codeHtml += `

                    <div class="code-char">
                        ${cleanCode[i]}
                    </div>

                `;

            }


            codeHtml += `

                    </div>

                    <button
                        class="btn-copy"
                        onclick="copyCode()"
                    >
                        📋 COPY PAIRING CODE
                    </button>

                </div>

            `;


            resultDiv.innerHTML =
                codeHtml;

            // Refresh count after successful connection request
            fetchActiveSessions();
        }


        /* ERROR */

        else {

            resultDiv.innerHTML = `

                <div class="error-message">
                    ❌ ${
                        data.message ||
                        'Failed to generate pairing code.'
                    }
                </div>

            `;

        }

    }


    catch (error) {

        console.error(
            'Railway error:',
            error
        );


        loader.style.display = 'none';

        connectBtn.disabled = false;

        connectBtn.style.opacity = '1';

        connectBtn.innerText =
            '⚡ CONNECT BOT';


        resultDiv.innerHTML = `

            <div class="error-message">
                ❌ Server connection error.
                Please try again.
            </div>

        `;

    }

}


/* =====================================================
   COPY CODE
===================================================== */

async function copyCode() {

    if (!currentPairCode)
        return;


    const btn =
        document.querySelector('.btn-copy');


    try {

        await navigator.clipboard
            .writeText(currentPairCode);


        btn.innerText =
            '✅ CODE COPIED!';


        btn.style.background =
            'rgba(74,222,128,.22)';


        setTimeout(() => {

            btn.innerText =
                '📋 COPY PAIRING CODE';

            btn.style.background =
                'rgba(74,222,128,.08)';

        }, 2000);


    }

    catch (error) {

        const textarea =
            document.createElement(
                'textarea'
            );

        textarea.value =
            currentPairCode;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            'copy'
        );

        textarea.remove();


        btn.innerText =
            '✅ CODE COPIED!';


        setTimeout(() => {

            btn.innerText =
                '📋 COPY PAIRING CODE';

        }, 2000);

    }

}


/* =====================================================
   ENTER = CONNECT
===================================================== */

document
    .getElementById('phone')
    .addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter'
            ) {

                getPairingCode();

            }

        }
    );

</script>

</body>
</html>
