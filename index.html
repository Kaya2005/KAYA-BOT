<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA-BOT | Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #040706;
            --card-bg: #0b1310;
            --card-border: #14241d;
            --accent-gold: #f59e0b;
            --accent-gold-hover: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at center, rgba(245, 158, 11, 0.05) 0%, transparent 70%);
        }

        .landing-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .landing-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .logo-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .logo-title span {
            color: var(--accent-gold);
        }

        .description {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .feature-item {
            background: #040706;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-hover));
            color: #000;
            text-decoration: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            display: block;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5);
        }

        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            background: #040706;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .social-btn:hover {
            border-color: var(--accent-gold);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="badge">✨ Next-Gen Edition</div>
        
        <h1 class="logo-title">ƘƛƳƛ<span>-ƁƠƬ</span></h1>
        
        <p class="description">
            Experience the ultimate lightning-fast WhatsApp Multi-Device pairing system.
        </p>

        <div class="features">
            <div class="feature-item">⚡ Instant Pairing</div>
            <div class="feature-item">🔒 100% Secure</div>
            <div class="feature-item">🤖 Multi-Session</div>
            <div class="feature-item">🚀 24/7 Uptime</div>
        </div>

        <a href="pair.html" class="btn-start">CONNECT BOT NOW 🚀</a>

        <div class="social-links">
            <a href="https://whatsapp.com/channel/0056..." target="_blank" class="social-btn">📢 WhatsApp</a>
            <a href="https://t.me/kayatech2" target="_blank" class="social-btn">✈️ Telegram</a>
        </div>
    </div>

</body>
</html>
