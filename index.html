<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA-BOT | WhatsApp Pairing Dashboard</title>
    
    <!-- ADCASE LIBRARY -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        aclib.runAutoTag({
            zoneId: 'kmqkkqhdoj',
        });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030704;
            --card-bg: #07130c;
            --input: #040a07;
            --border: rgba(34, 197, 94, 0.2);
            --border-hover: rgba(34, 197, 94, 0.6);
            --gold: #fbbf24;
            --orange: #f97316;
            --orange-glow: rgba(249, 115, 22, 0.45);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.35);
            --red: #f87171;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: 
                radial-gradient(circle at 50% -10%, rgba(249,115,22,0.12), transparent 50%),
                radial-gradient(circle at 50% 110%, rgba(34,197,94,0.15), transparent 50%),
                var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .dashboard {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CARTE PRINCIPALE ÉPURÉE (SANS DOUBLE CADRE) --- */
        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--gold);
            font-size: 10px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #fff;
        }

        .brand-title span { color: var(--gold); }

        .card-desc {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        /* --- CHAMPS DE FORMULAIRE --- */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .custom-dropdown { position: relative; width: 100%; }

        .dropdown-selected {
            height: 48px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--input);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            transition: all 0.2s;
        }

        .dropdown-selected:hover { border-color: var(--border-hover); }
        .dropdown-selected.active { border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }

        .dropdown-list-container {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            max-height: 240px;
            background: #050f09;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 99;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .dropdown-search-box {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: #030805;
        }

        .dropdown-search-box input {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input);
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .dropdown-options { overflow-y: auto; max-height: 180px; padding: 4px; }

        .dropdown-option {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }

        .dropdown-option:hover { background: rgba(34,197,94,0.15); color: #fff; }
        .dropdown-option .opt-code { font-family: 'JetBrains Mono', monospace; color: var(--green); font-weight: 700; }

        .phone-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; }

        .country-code-input, input[type="tel"] {
            height: 48px;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            transition: all 0.2s;
        }

        .country-code-input { text-align: center; color: var(--green); }
        input[type="tel"] { padding: 0 14px; }
        input::placeholder { color: #3b5244; font-size: 11px; }

        .country-code-input:focus, input[type="tel"]:focus {
            border-color: var(--green);
            box-shadow: 0 0 12px var(--green-glow);
        }

        /* --- GROS BOUTON D'ACTION PROFESSIONNEL & LUMINEUX --- */
        .btn-action-main {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #ffffff;
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 22px var(--orange-glow);
            transition: all 0.25s ease;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .btn-action-main:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.6);
        }

        .btn-action-main:active { transform: scale(0.98); }
        .btn-action-main:disabled { cursor: wait; opacity: 0.6; transform: none; }

        .btn-refresh {
            width: 100%;
            height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-refresh:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .loader {
            width: 26px; height: 26px;
            margin: 12px auto 2px;
            display: none;
            border-radius: 50%;
            border: 3px solid rgba(249,115,22,0.15);
            border-top-color: var(--orange);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #result { margin-top: 12px; text-align: center; }

        .code-wrapper {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(249,115,22,0.3);
            background: #040906;
        }

        .code-title {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .code-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-bottom: 10px;
        }

        .code-char {
            width: 26px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            border: 1px solid rgba(249,115,22,0.3);
            background: #06110a;
            color: var(--orange);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .code-char.dash { width: 6px; border: none; background: transparent; color: var(--gold); }

        .btn-copy {
            width: 100%;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(249,115,22,0.4);
            background: rgba(249,115,22,0.15);
            color: var(--orange);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover { background: rgba(249,115,22,0.25); }
        .error-message { color: var(--red); font-size: 11px; font-weight: 700; }

        /* --- WIDGET SESSIONS ACTIVES --- */
        .logs-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logs-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 16px;
        }

        .modal-content {
            background: #07130c;
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%; max-width: 400px; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 16px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .modal-title { font-size: 13px; font-weight: 700; }
        .modal-close {
            background: rgba(255,255,255,0.05); border: none; color: #fff;
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .number-item {
            background: var(--input); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; padding: 10px 12px;
            display: flex; align-items: center; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
        }
        .number-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .number-status { font-size: 10px; font-weight: 700; color: var(--green); text-transform: uppercase; }

        /* --- FOOTER CANAUX --- */
        .channels-footer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .channel-btn {
            height: 42px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            border-radius: 12px; text-decoration: none; font-size: 11px; font-weight: 700;
            color: #fff; border: 1px solid rgba(255,255,255,0.08);
            background: var(--card-bg); transition: all 0.2s;
        }
        .channel-btn:hover { border-color: var(--border-hover); background: #0a1b12; }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- CARTE PRINCIPALE -->
    <div class="main-card">
        <div class="badge">✨ Next-Gen Edition</div>
        
        <div class="brand-title">KΛYΛ-<span>BØT</span></div>
        
        <div class="card-desc">
            Connect your WhatsApp multi-device bot instantly by generating a secure pairing code.
        </div>

        <!-- SÉLECTEUR DE PAYS -->
        <div class="input-group">
            <label class="input-label">Select Country</label>
            <div class="custom-dropdown" id="countryDropdown">
                <div class="dropdown-selected" id="dropdownSelected" onclick="toggleDropdown()">
                    <span id="selectedCountryText">🇨🇩 Democratic Republic of the Congo (+243)</span>
                    <span style="font-size: 9px; color: var(--muted);">▼</span>
                </div>
                <div class="dropdown-list-container" id="dropdownList">
                    <div class="dropdown-search-box">
                        <input type="text" id="countrySearch" placeholder="🔍 Search country..." oninput="filterCountries()">
                    </div>
                    <div class="dropdown-options" id="dropdownOptions"></div>
                </div>
            </div>
        </div>

        <!-- NUMÉRO WHATSAPP -->
        <div class="input-group">
            <label class="input-label">WhatsApp Number</label>
            <div class="phone-row">
                <input type="text" id="prefixInput" class="country-code-input" value="+243" maxlength="4" autocomplete="off" oninput="syncCountryFromPrefix()">
                <input type="tel" id="phone" placeholder="9999585890" autocomplete="off" inputmode="numeric">
            </div>
        </div>

        <!-- GROS BOUTON D'ACTION PRINCIPAL -->
        <button class="btn-action-main" id="connectBtn" onclick="getPairingCode()">
            <span>Connect Bot Now</span>
            <span style="font-size: 16px;">🚀</span>
        </button>

        <!-- BOUTON REFRESH -->
        <button class="btn-refresh" onclick="window.location.reload()">↻ Refresh Dashboard</button>

        <div class="loader" id="loader"></div>
        <div id="result"></div>
    </div>

    <!-- WIDGET SESSIONS ACTIVES -->
    <div class="logs-card" onclick="openConnectedModal()">
        <div id="activeCount" style="font-size: 12px; font-weight: bold; color: var(--green);">
            🟢 Loading connected bots...
        </div>
        <div style="font-size: 9px; color: var(--muted); margin-top: 2px;">👆 Tap to view connected numbers</div>
    </div>

    <!-- FOOTER CANAUX -->
    <div class="channels-footer">
        <a href="https://whatsapp.com/channel/0029Vb91eHA7Noa7fCn1vp3j" target="_blank" rel="noopener" class="channel-btn">📢 WhatsApp</a>
        <a href="https://t.me/kayatech2" target="_blank" rel="noopener" class="channel-btn">✈️ Telegram</a>
    </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="connectedModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Connected Numbers</div>
            <button class="modal-close" onclick="closeConnectedModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBodyList">
            <div style="text-align: center; color: var(--muted); padding: 20px;">Loading numbers...</div>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = 'https://kayabot.duckdns.org';
    let currentPairCode = '';

    const countries = [
        { name: "Afghanistan", code: "+93", flag: "🇦🇫" },
        { name: "Albania", code: "+355", flag: "🇦🇱" },
        { name: "Algeria", code: "+213", flag: "🇩🇿" },
        { name: "Angola", code: "+244", flag: "🇦🇴" },
        { name: "Argentina", code: "+54", flag: "🇦🇷" },
        { name: "Australia", code: "+61", flag: "🇦🇺" },
        { name: "Austria", code: "+43", flag: "🇦🇹" },
        { name: "Belgium", code: "+32", flag: "🇧🇪" },
        { name: "Benin", code: "+229", flag: "🇧🇯" },
        { name: "Botswana", code: "+267", flag: "🇧🇼" },
        { name: "Brazil", code: "+55", flag: "🇧🇷" },
        { name: "Cameroon", code: "+237", flag: "🇨🇲" },
        { name: "Canada", code: "+1", flag: "🇨🇦" },
        { name: "Democratic Republic of the Congo", code: "+243", flag: "🇨🇩" },
        { name: "Republic of the Congo", code: "+242", flag: "🇨🇬" },
        { name: "Ivory Coast", code: "+225", flag: "🇨🇮" },
        { name: "Egypt", code: "+20", flag: "🇪🇬" },
        { name: "France", code: "+33", flag: "🇫🇷" },
        { name: "Gabon", code: "+241", flag: "🇬🇦" },
        { name: "Germany", code: "+49", flag: "🇩🇪" },
        { name: "Ghana", code: "+233", flag: "🇬🇭" },
        { name: "India", code: "+91", flag: "🇮🇳" },
        { name: "Italy", code: "+39", flag: "🇮🇹" },
        { name: "Kenya", code: "+254", flag: "🇰🇪" },
        { name: "Morocco", code: "+212", flag: "🇲🇦" },
        { name: "Nigeria", code: "+234", flag: "🇳🇬" },
        { name: "Senegal", code: "+221", flag: "🇸🇳" },
        { name: "South Africa", code: "+27", flag: "🇿🇦" },
        { name: "Spain", code: "+34", flag: "🇪🇸" },
        { name: "Switzerland", code: "+41", flag: "🇨🇭" },
        { name: "Tanzania", code: "+255", flag: "🇹🇿" },
        { name: "Turkey", code: "+90", flag: "🇹🇷" },
        { name: "Uganda", code: "+256", flag: "🇺🇬" },
        { name: "United Kingdom", code: "+44", flag: "🇬🇧" },
        { name: "United States", code: "+1", flag: "🇺🇸" }
    ];

    function renderCountries(list) {
        const container = document.getElementById('dropdownOptions');
        container.innerHTML = '';
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'dropdown-option';
            div.innerHTML = `<span>${c.flag} ${c.name}</span> <span class="opt-code">${c.code}</span>`;
            div.onclick = () => selectCountry(c);
            container.appendChild(div);
        });
    }

    function toggleDropdown() {
        const list = document.getElementById('dropdownList');
        const selectedBox = document.getElementById('dropdownSelected');
        const isVisible = list.style.display === 'flex';
        list.style.display = isVisible ? 'none' : 'flex';
        if (!isVisible) {
            selectedBox.classList.add('active');
            document.getElementById('countrySearch').focus();
        } else {
            selectedBox.classList.remove('active');
        }
    }

    function selectCountry(country) {
        document.getElementById('selectedCountryText').innerText = `${country.flag} ${country.name} (${country.code})`;
        document.getElementById('prefixInput').value = country.code;
        document.getElementById('dropdownList').style.display = 'none';
        document.getElementById('dropdownSelected').classList.remove('active');
    }

    function filterCountries() {
        const query = document.getElementById('countrySearch').value.toLowerCase();
        const filtered = countries.filter(c => c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query));
        renderCountries(filtered);
    }

    function syncCountryFromPrefix() {
        let input = document.getElementById('prefixInput');
        let val = input.value;
        if (!val.startsWith('+')) val = '+' + val.replace(/[^0-9]/g, '');
        else val = '+' + val.slice(1).replace(/[^0-9]/g, '');
        if (val.length > 4) val = val.slice(0, 4);
        input.value = val;

        const sortedCountries = [...countries].sort((a, b) => b.code.length - a.code.length);
        const matched = sortedCountries.find(c => c.code === val || val.startsWith(c.code));
        if (matched) {
            document.getElementById('selectedCountryText').innerText = `${matched.flag} ${matched.name} (${matched.code})`;
        } else {
            document.getElementById('selectedCountryText').innerText = `🌐 Custom Code (${val})`;
        }
    }

    window.addEventListener('click', function(e) {
        const dropdown = document.getElementById('countryDropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            document.getElementById('dropdownList').style.display = 'none';
            document.getElementById('dropdownSelected').classList.remove('active');
        }
    });

    renderCountries(countries);
    fetchActiveSessions();

    async function fetchActiveSessions() {
        try {
            const response = await fetch(`${BACKEND_URL}/api/online-count`);
            const data = await response.json();
            if (data.success) {
                document.getElementById('activeCount').innerText = `🟢 ${data.totalConnected} connected bots`;
            }
        } catch (e) {
            document.getElementById('activeCount').innerText = '🟢 Active sessions online';
        }
    }

    async function openConnectedModal() {
        const modal = document.getElementById('connectedModal');
        const modalBody = document.getElementById('modalBodyList');
        modal.style.display = 'flex';
        modalBody.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 20px;">Loading numbers...</div>`;

        try {
            const response = await fetch(`${BACKEND_URL}/api/connected-list`);
            const data = await response.json();
            if (data.success && data.numbers && data.numbers.length > 0) {
                let html = '';
                data.numbers.forEach(num => {
                    let clean = num.toString().trim();
                    if (!clean.startsWith('+')) clean = '+' + clean;
                    let masked = clean.length > 8 ? `${clean.slice(0, 5)}****${clean.slice(-2)}` : clean;
                    html += `<div class="number-item"><div style="display:flex; align-items:center; gap:10px;"><div class="number-dot"></div><span>${masked}</span></div><div class="number-status">Connected</div></div>`;
                });
                modalBody.innerHTML = html;
            } else {
                modalBody.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 20px;">No numbers currently connected.</div>`;
            }
        } catch (error) {
            modalBody.innerHTML = `<div style="text-align: center; color: var(--red); padding: 20px;">Failed to load connected numbers.</div>`;
        }
    }

    function closeConnectedModal() {
        document.getElementById('connectedModal').style.display = 'none';
    }

    async function getPairingCode() {
        let prefix = document.getElementById('prefixInput').value.trim();
        const phoneInput = document.getElementById('phone');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        const connectBtn = document.getElementById('connectBtn');

        if (!prefix.startsWith('+')) prefix = '+' + prefix;
        let rawNumber = phoneInput.value.trim().replace(/\s+/g, '');
        if (rawNumber.startsWith('0')) rawNumber = rawNumber.slice(1);
        const fullPhone = prefix + rawNumber;

        if (!rawNumber || rawNumber.length < 8 || !/^[0-9]+$/.test(rawNumber)) {
            resultDiv.innerHTML = `<div class="error-message">❌ Please enter a valid WhatsApp number.</div>`;
            return;
        }

        resultDiv.innerHTML = '';
        loader.style.display = 'block';
        connectBtn.disabled = true;
        connectBtn.innerHTML = '<span>⏳ Generating Code...</span>';

        try {
            const response = await fetch(`${BACKEND_URL}/api/connect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: fullPhone })
            });
            const data = await response.json();

            loader.style.display = 'none';
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<span>Connect Bot Now</span><span style="font-size: 16px;">🚀</span>';

            if (data.success && data.code) {
                currentPairCode = data.code;
                const cleanCode = data.code.replace(/-/g, '').trim();
                let codeHtml = `<div class="code-wrapper"><div class="code-title">Your Pairing Code</div><div class="code-container">`;
                for (let i = 0; i < cleanCode.length; i++) {
                    if (i > 0 && i % 4 === 0) codeHtml += `<div class="code-char dash">-</div>`;
                    codeHtml += `<div class="code-char">${cleanCode[i]}</div>`;
                }
                codeHtml += `</div><button class="btn-copy" onclick="copyCode()">📋 COPY PAIRING CODE</button></div>`;
                resultDiv.innerHTML = codeHtml;
                fetchActiveSessions();
            } else {
                resultDiv.innerHTML = `<div class="error-message">❌ ${data.message || 'Failed to generate pairing code.'}</div>`;
            }
        } catch (error) {
            loader.style.display = 'none';
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<span>Connect Bot Now</span><span style="font-size: 16px;">🚀</span>';
            resultDiv.innerHTML = `<div class="error-message">❌ Server connection error. Please try again.</div>`;
        }
    }

    async function copyCode() {
        if (!currentPairCode) return;
        const btn = document.querySelector('.btn-copy');
        try {
            await navigator.clipboard.writeText(currentPairCode);
            btn.innerText = '✅ CODE COPIED!';
            setTimeout(() => { btn.innerText = '📋 COPY PAIRING CODE'; }, 2000);
        } catch (error) {
            btn.innerText = '✅ CODE COPIED!';
            setTimeout(() => { btn.innerText = '📋 COPY PAIRING CODE'; }, 2000);
        }
    }

    document.getElementById('phone').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') getPairingCode();
    });
</script>

</body>
</html>
