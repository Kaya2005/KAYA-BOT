<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAYA-BOT | Multi-Device Dashboard</title>

    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>

    <style>
        :root {
            --bg: #07090e;
            --surface: #0d131f;
            --surface-hover: #141c2e;
            --border: #1e293b;
            --border-focus: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --green: #10b981;
            --green-bg: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* --- BARRE DE NAVIGATION SUPÉRIEURE (STYLE KATABUMP) --- */
        .app-navbar {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.4);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .status-badge {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        /* --- CARTE PRINCIPALE DE CONNEXION --- */
        .main-panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .panel-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        /* --- BOUTON TOGGLE CONFIG --- */
        .btn-toggle-config {
            width: 100%;
            height: 42px;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-toggle-config:hover { border-color: var(--accent); color: var(--text-main); background: var(--surface-hover); }

        /* --- SECTION CONFIG CACHÉE --- */
        .config-collapse {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: rgba(7, 9, 14, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        /* --- INPUTS & FORMULAIRE --- */
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-select-wrapper {
            position: relative;
            width: 100%;
        }

        .select-trigger {
            height: 46px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-trigger:hover { border-color: var(--text-muted); }
        .select-trigger.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .dropdown-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            max-height: 230px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
        }

        .search-filter-box {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .search-filter-box input {
            width: 100%;
            height: 38px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 10px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .options-scroller {
            overflow-y: auto;
            max-height: 160px;
            padding: 4px;
        }

        .country-option {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .country-option:hover { background-color: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .country-option span.code { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }

        .phone-grid {
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 8px;
        }

        .custom-input {
            height: 46px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 12px;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }

        .custom-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .custom-input.prefix { text-align: center; color: #34d399; font-weight: 700; }
        .custom-input::placeholder { color: #475569; font-size: 11px; font-family: 'Inter', sans-serif; }

        /* --- BOUTON PRINCIPAL STYLE KATABUMP --- */
        .btn-connect {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-connect:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-connect:active { transform: translateY(1px); }
        .btn-connect:disabled { opacity: 0.6; cursor: wait; transform: none; }

        .btn-reload {
            width: 100%;
            height: 40px;
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-reload:hover { background: var(--surface-hover); color: var(--text-main); border-color: var(--text-muted); }

        .spinner {
            width: 24px; height: 24px;
            margin: 14px auto 0;
            display: none;
            border-radius: 50%;
            border: 2px solid rgba(99,102,241,0.2);
            border-top-color: var(--accent);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #result { margin-top: 14px; text-align: center; }

        .code-display-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .code-header-text {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .code-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .char-box {
            width: 30px; height: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #34d399;
            font-weight: 700;
        }
        .char-box.dash { width: 8px; border: none; background: transparent; color: var(--text-muted); }

        .btn-copy-code {
            width: 100%;
            height: 38px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #818cf8;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy-code:hover { background: rgba(99, 102, 241, 0.25); }
        .error-message { color: var(--red); font-size: 11px; font-weight: 600; }

        /* --- STATS / SESSIONS ACTIVES (STYLE PANNEAU) --- */
        .sessions-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .sessions-card:hover { border-color: var(--accent); transform: translateY(-1px); }

        /* --- MODAL --- */
        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 999; padding: 16px;
        }
        .modal-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%; max-width: 400px; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-top {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; font-weight: 700;
        }
        .modal-exit { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
        .modal-inner { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .session-row {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px;
            display: flex; align-items: center; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
        }
        .session-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

        /* --- LIENS SOCIAUX --- */
        .social-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .social-btn {
            height: 42px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; text-decoration: none; color: var(--text-main);
            font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .social-btn:hover { background: var(--surface-hover); border-color: var(--text-muted); }
    </style>
</head>
<body>

<div class="app-container">

    <!-- BARRE DE NAVIGATION -->
    <div class="app-navbar">
        <div class="brand-box">
            <div class="brand-logo">K</div>
            <div class="brand-title">KAYA-BOT</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </div>

    <!-- CARTE PRINCIPALE -->
    <div class="main-panel">
        <div class="panel-header">
            <span>Pairing Dashboard</span>
            <span style="font-size: 10px; color: var(--text-muted); font-family: monospace;">v2.6</span>
        </div>

        <!-- BOUTON POUR AFFICHER/MASQUER LA CONFIGURATION AVANCÉE -->
        <button class="btn-toggle-config" onclick="toggleConfigPanel()">
            <span id="configToggleIcon">⚙️</span>
            <span id="configToggleText">Click here to configure the bot</span>
        </button>

        <!-- SECTION CONFIGURATION CACHÉE PAR DÉFAUT -->
        <div class="config-collapse" id="configCollapsePanel">
            <div class="form-group">
                <label class="form-label">Bot Name (Optionnel)</label>
                <input type="text" id="botNameInput" class="custom-input" placeholder="Ex: KAYA-BOT">
            </div>

            <div class="form-group">
                <label class="form-label">Bot Prefix (Optionnel)</label>
                <input type="text" id="botPrefixInput" class="custom-input" placeholder="Ex: ." style="text-align: center;">
            </div>

            <div class="form-group">
                <label class="form-label">Bot Image URL (Optionnel)</label>
                <input type="url" id="botImageInput" class="custom-input" placeholder="https://example.com/image.jpg">
            </div>
        </div>

        <!-- SÉLECTEUR DE PAYS -->
        <div class="form-group">
            <label class="form-label">Country Region</label>
            <div class="custom-select-wrapper" id="customDropdown">
                <div class="select-trigger" id="selectTrigger" onclick="toggleDropdown()">
                    <span id="selectedCountryDisplay">🇨🇩 Congo, Democratic Republic (+243)</span>
                    <span style="font-size: 9px; color: var(--text-muted);">▼</span>
                </div>
                <div class="dropdown-panel" id="dropdownMenu">
                    <div class="search-filter-box">
                        <input type="text" id="searchInput" placeholder="Search country or code..." oninput="filterCountries()">
                    </div>
                    <div class="options-scroller" id="optionsContainer"></div>
                </div>
            </div>
        </div>

        <!-- NUMÉRO -->
        <div class="form-group">
            <label class="form-label">WhatsApp Number</label>
            <div class="phone-grid">
                <input type="text" id="prefixInput" class="custom-input prefix" value="+243" maxlength="4" oninput="syncCountryFromPrefix()">
                <input type="tel" id="phone" class="custom-input" placeholder="9999585890" inputmode="numeric">
            </div>
        </div>

        <!-- BOUTON DE CONNEXION PRINCIPAL -->
        <button class="btn-connect" id="connectBtn" onclick="getPairingCode()">
            <span>Connect Bot Now</span>
            <span style="font-size: 16px;">🚀</span>
        </button>

        <button class="btn-reload" onclick="window.location.reload()">Reload Interface</button>

        <div class="spinner" id="loader"></div>
        <div id="result"></div>
    </div>

    <!-- WIDGET SESSIONS -->
    <div class="sessions-card" onclick="openConnectedModal()">
        <div id="activeCount" style="font-size: 12px; font-weight: 700; color: #34d399;">
            🟢 Checking active instances...
        </div>
        <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">Tap to view connected numbers</div>
    </div>

    <!-- LIENS -->
    <div class="social-footer">
        <a href="https://whatsapp.com/channel/0029Vb91eHA7Noa7fCn1vp3j" target="_blank" rel="noopener" class="social-btn">📢 WhatsApp</a>
        <a href="https://t.me/kayatech2" target="_blank" rel="noopener" class="social-btn">✈️ Telegram</a>
    </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="connectedModal">
    <div class="modal-window">
        <div class="modal-top">
            <span>Connected Instances</span>
            <button class="modal-exit" onclick="closeConnectedModal()">✕</button>
        </div>
        <div class="modal-inner" id="modalBodyList">
            <div style="text-align: center; color: var(--text-muted); padding: 15px; font-size: 12px;">Loading active sessions...</div>
        </div>
    </div>
</div>

        const panel = document.getElementById('configCollapsePanel');

        const icon = document.getElementById('configToggleIcon');

            panel.style.display = 'none';
            text.innerText = 'Click here to configure the bot';
            icon.innerText = '⚙️';

    function renderCountries(list) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'country-option';
            div.innerHTML = `<span>${c.flag} ${c.name}</span> <span class="code">${c.code}</span>`;
            div.onclick = () => selectCountry(c);
            container.appendChild(div);
        });
    }

    function toggleDropdown() {
        const menu = document.getElementById('dropdownMenu');
        const trigger = document.getElementById('selectTrigger');
        const isVisible = menu.style.display === 'flex';
        menu.style.display = isVisible ? 'none' : 'flex';
        if (!isVisible) {
            trigger.classList.add('active');
            document.getElementById('searchInput').focus();
        } else {
            trigger.classList.remove('active');
        }
    }

    function selectCountry(c) {
        document.getElementById('selectedCountryDisplay').innerText = `${c.flag} ${c.name} (${c.code})`;
        document.getElementById('prefixInput').value = c.code;
        document.getElementById('dropdownMenu').style.display = 'none';
        document.getElementById('selectTrigger').classList.remove('active');
    }

    function filterCountries() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = countries.filter(c => c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query));
        renderCountries(filtered);
    }

    function syncCountryFromPrefix() {
        let input = document.getElementById('prefixInput');
        let val = input.value;
        if (!val.startsWith('+')) val = '+' + val.replace(/[^0-9]/g, '');
        else val = '+' + val.slice(1).replace(/[^0-9]/g, '');
        if (val.length > 4) val = val.slice(0, 4);
        input.value = val;

        const sorted = [...countries].sort((a, b) => b.code.length - a.code.length);
        const matched = sorted.find(c => c.code === val || val.startsWith(c.code));
        if (matched) {
            document.getElementById('selectedCountryDisplay').innerText = `${matched.flag} ${matched.name} (${matched.code})`;
        } else {
            document.getElementById('selectedCountryDisplay').innerText = `🌐 Custom Code (${val})`;
        }
    }

    window.addEventListener('click', function(e) {
        const drop = document.getElementById('customDropdown');
        if (drop && !drop.contains(e.target)) {
            document.getElementById('dropdownMenu').style.display = 'none';
            document.getElementById('selectTrigger').classList.remove('active');
        }
    });

    renderCountries(countries);
    fetchActiveSessions();

    async function fetchActiveSessions() {
        try {
            const response = await fetch(`${BACKEND_URL}/api/online-count`);
            const data = await response.json();
            if (data.success) {
                document.getElementById('activeCount').innerText = `🟢 ${data.totalConnected} active instances online`;
            }
        } catch (e) {
            document.getElementById('activeCount').innerText = '🟢 Active instances online';
        }
    }

    async function openConnectedModal() {
        const modal = document.getElementById('connectedModal');
        const body = document.getElementById('modalBodyList');
        modal.style.display = 'flex';
        body.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 15px; font-size: 12px;">Fetching instances...</div>`;

        try {
            const response = await fetch(`${BACKEND_URL}/api/connected-list`);
            const data = await response.json();
            if (data.success && data.numbers && data.numbers.length > 0) {
                let html = '';
                data.numbers.forEach(num => {
                    let clean = num.toString().trim();
                    if (!clean.startsWith('+')) clean = '+' + clean;
                    let masked = clean.length > 8 ? `${clean.slice(0, 5)}****${clean.slice(-2)}` : clean;
                    html += `<div class="session-row"><div style="display:flex; align-items:center; gap:8px;"><div class="session-dot"></div><span>${masked}</span></div><span style="color:var(--green); font-size:10px; font-weight:700;">CONNECTED</span></div>`;
                });
                body.innerHTML = html;
            } else {
                body.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 15px; font-size: 12px;">No active instances found.</div>`;
            }
        } catch (error) {
            body.innerHTML = `<div style="text-align: center; color: var(--red); padding: 15px; font-size: 12px;">Failed to retrieve sessions.</div>`;
        }
    }

    function closeConnectedModal() {
        document.getElementById('connectedModal').style.display = 'none';
    }

    async function getPairingCode() {
        let prefix = document.getElementById('prefixInput').value.trim();
        const phoneInput = document.getElementById('phone');
        
        const botName = document.getElementById('botNameInput').value.trim();
        const botPrefix = document.getElementById('botPrefixInput').value.trim();
        const botImage = document.getElementById('botImageInput').value.trim();

        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        const connectBtn = document.getElementById('connectBtn');

        if (!prefix.startsWith('+')) prefix = '+' + prefix;
        let rawNumber = phoneInput.value.trim().replace(/\s+/g, '');
        if (rawNumber.startsWith('0')) rawNumber = rawNumber.slice(1);
        const fullPhone = prefix + rawNumber;

        if (!rawNumber || rawNumber.length < 8 || !/^[0-9]+$/.test(rawNumber)) {
            resultDiv.innerHTML = `<span class="error-message">❌ Please enter a valid phone number.</span>`;
            return;
        }

        resultDiv.innerHTML = '';
        loader.style.display = 'block';
        connectBtn.disabled = true;
        connectBtn.innerHTML = '<span>Processing...</span>';

        try {
            const payload = { phone: fullPhone };
            if (botName) payload.botName = botName;
            if (botPrefix) payload.botPrefix = botPrefix;
            if (botImage) payload.botImage = botImage;

            const response = await fetch(`${BACKEND_URL}/api/connect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            loader.style.display = 'none';
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<span>Connect Bot Now</span><span style="font-size: 16px;">🚀</span>';

            if (data.success && data.code) {
                currentPairCode = data.code;
                const cleanCode = data.code.replace(/-/g, '').trim();
                let html = `<div class="code-display-card"><div class="code-header-text">Generated Pairing Code</div><div class="code-row">`;
                for (let i = 0; i < cleanCode.length; i++) {
                    if (i > 0 && i % 4 === 0) html += `<div class="char-box dash">-</div>`;
                    html += `<div class="char-box">${cleanCode[i]}</div>`;
                }
                html += `</div><button class="btn-copy-code" onclick="copyCode()">📋 COPY PAIRING CODE</button></div>`;
                resultDiv.innerHTML = html;
                fetchActiveSessions();
            } else {
                resultDiv.innerHTML = `<span class="error-message">❌ ${data.message || 'Generation failed.'}</span>`;
            }
        } catch (error) {
            loader.style.display = 'none';
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<span>Connect Bot Now</span><span style="font-size: 16px;">🚀</span>';
            resultDiv.innerHTML = `<span class="error-message">❌ Network error. Please try again.</span>`;
        }
    }

    async function copyCode() {
        if (!currentPairCode) return;
        const btn = document.querySelector('.btn-copy-code');
        try {
            await navigator.clipboard.writeText(currentPairCode);
            btn.innerText = '✅ CODE COPIED!';
            setTimeout(() => { btn.innerText = '📋 COPY PAIRING CODE'; }, 2000);
        } catch (error) {
            btn.innerText = '✅ CODE COPIED!';
            setTimeout(() => { btn.innerText = '📋 COPY PAIRING CODE'; }, 2000);
        }
    }

    document.getElementById('phone').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') getPairingCode();
    });
